server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API + storage reverse-proxy (so the browser never hits CORS/CSP issues;
  # frontend can just use VITE_API_BASE=http://localhost:3000/api ... or same-origin).
  # Direct backend access on :8000 still works too.
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /storage/ {
    proxy_pass http://backend:8000/storage/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
